<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Document Template</title>
  <style>

    p {
        margin:0;
    }

    *{
        box-sizing:border-box;
    }

    body {
        margin:0;

        display:flex;
        justify-content:center;
        align-items:center;

        min-height:100vh;
    }
    .box {
        width:430px;
        padding:50px 0;
        
        border-radius: 30px;
        border: 1px solid #A9A9A9 ;
        
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

    }

    .child-box {
        width: 283px;
        
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 45px;

    }
    .text-box {
        width: 283px;
        
        display: flex;
        flex-direction: column;
        align-items: center;
        
        gap: 30px;
    }
    .logo {
        height: 68px;

        display: flex;
        flex-direction: column;
        align-items: center;
        
        gap: 15px;

    }
    .content {
        

        display: flex;
        flex-direction: column;
        align-items: center;
      
        gap: 8px;

        font-family: Inter;
        font-size: 14px;
        font-weight: 500;
        color: #A9A9A9;
        text-align: center;

    }
    .code {
        
        font-family: Inter;
        font-size: 40px;
        font-weight: 900;
        color: #1274FF;
        text-align: center;

    }
    .footer {
        width: 100%;
        
        display: flex;
        flex-direction: column;
        align-items: center;
        
        gap: 16px;
    }
    .divider {
        width: 280px;
        border-top: 1px solid #A9A9A9;
    }



  </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class=" box">
        <div class = "child-box">
            <div class = "text-box">
                <div class = "logo">
                    <p style="
                    font-family: Amaranth;
                    font-size: 32px;
                    font-weight: 700;
                    color: #1274FF;
                    text-align: center;
                    "> Ping-Pong</p>

                    <p style="
                    font-family: Vorhersehbar;
                    font-size: 18px;
                    font-weight: 400;
                    color: #000000;
                    text-align: center;
                    ">Reset your password</p>

                </div>
                
                <div class = "content">
                    <p>Hello, {{UserName}}</p>
                    <p>We received a request to reset the password for your account.</p>
                    <p>Please use the verification code below to continue:</p>
                </div>
            </div>

            <div class = "code">
                <p>{{ResetCode}}</p>
            </div>

            <div class = "footer">
                <div class ="divider"></div>
                <p style="
                    font-family: Inter;
                    font-size: 10px;
                    font-weight: 500;
                    color: #A9A9A9;
                    text-align: center;
                    "> © 2026 PingPong. All Rights Reserved
                </p>
            </div>

        </div>

    </div>
  
</body>
</html>
